name: CI

# Build and test every push to main and every pull request. Publishing a
# GitHub Release only happens when a `v*` tag is pushed, so nothing reaches
# users unless that tag is created deliberately.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build & test
    runs-on: ubuntu-latest
    # `pipewire = "0.10"` is compiled with the `v1_2_0` feature, which needs
    # PipeWire headers >= 1.2. The ubuntu-latest image still ships 1.0, so the
    # build runs in Debian trixie instead — also the platform Audibian targets.
    container: debian:trixie
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin \
            libpipewire-0.3-dev libspa-0.2-dev \
            clang libclang-dev

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # pnpm's own `node:sqlite` usage requires Node >=22.13; the
          # lockfile (pnpm 9+ format) also needs a pnpm new enough to parse
          # a settings-only pnpm-workspace.yaml, which older pnpm rejects
          # with "packages field missing or empty".
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        # tauri-build resolves `frontendDist: ui/dist` at compile time, so the
        # bundle has to exist before cargo runs — even for `cargo test`.
        run: |
          npm install -g pnpm
          cd ui && pnpm install --frozen-lockfile && pnpm run build

      - name: Clippy
        # Not gated on warnings: the tree carries pre-existing dead-code
        # findings. Kept visible so new lints are noticed in the log.
        run: cargo clippy --all-targets

      - name: Test
        run: cargo test --bin audibian

  package:
    name: AppImage
    runs-on: ubuntu-latest
    container: debian:trixie
    needs: check
    permissions:
      contents: write
    steps:
      - name: Install system dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates curl file git pkg-config \
            libssl-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev librsvg2-bin \
            libpipewire-0.3-dev libspa-0.2-dev \
            clang libclang-dev \
            desktop-file-utils patchelf zsync

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build frontend
        run: |
          npm install -g pnpm
          cd ui && pnpm install --frozen-lockfile && pnpm run build

      - name: Build AppImage
        # build-appimage.sh downloads linuxdeploy/appimagetool on demand and
        # already exports APPIMAGE_EXTRACT_AND_RUN, so no FUSE is required.
        run: make appimage

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Audibian-x86_64.AppImage
          path: Audibian-x86_64.AppImage
          if-no-files-found: error

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Audibian-x86_64.AppImage
          generate_release_notes: true
